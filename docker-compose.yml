version: '3.9'

services:

  # --- Mailpit (SMTP Fake Server + Web UI)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH: "false"   # pas besoin d'auth SMTP en local

  # --- Symfony (PHP + CLI)
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - mailpit
